---
name: Manually Build and Push Docker Images

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Comma-separated list of Docker image tags (e.g. latest,1.2.3)'
        required: true
        default: 'latest'
      labels:
        description: 'Comma-separated list of Docker image labels (e.g. org.opencontainers.image.title=vale-server)'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    environment: QUAY_USERNAME
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Quay.io
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_PASSWORD }}

      - name: Parse tags
        id: parse_tags
        run: |
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "${{ github.event.inputs.tags }}" | tr ',' '\n' | sed 's/^/quay.io\/ganelson\/vale-server:/g' | tr '\n' ',' | sed 's/,$//' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.parse_tags.outputs.tags }}
          labels: ${{ github.event.inputs.labels }}

      - name: Print image url
        run: |
          echo "Image(s) pushed to quay.io/ganelson/vale-server with tags: ${{ github.event.inputs.tags }}"
