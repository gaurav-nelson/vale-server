---
name: Check Vale rules updates and bump version

on:
  schedule:
    # Run daily at 06:15 UTC
    - cron: "15 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-vale-rules
  cancel-in-progress: false

env:
  TARGET_BRANCH: main
  MARKER_FILE: .github/last-vale-rules-version.txt

jobs:
  check-and-bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get latest Vale at Red Hat release
        id: latest
        uses: actions/github-script@v7
        with:
          script: |
            const res = await github.repos.getLatestRelease({
              owner: 'redhat-documentation',
              repo: 'vale-at-red-hat',
            });
            core.setOutput('tag', res.data.tag_name);
            core.info(`Latest upstream release: ${res.data.tag_name}`);

      - name: Determine previous processed release
        id: previous
        run: |
          if [ -f "$MARKER_FILE" ]; then
            PREV=$(cat "$MARKER_FILE" | tr -d '\n' )
          else
            PREV=""
          fi
          echo "prev=$PREV" >> $GITHUB_OUTPUT
          echo "Previous upstream release: ${PREV:-<none>}"

      - name: Skip if no new release
        if: ${{ steps.latest.outputs.tag == steps.previous.outputs.prev }}
        run: |
          echo "No new upstream release. Skipping bump."

      - name: Set up Node.js
        if: ${{ steps.latest.outputs.tag != steps.previous.outputs.prev }}
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Update marker file and bump patch version
        if: ${{ steps.latest.outputs.tag != steps.previous.outputs.prev }}
        run: |
          echo "${{ steps.latest.outputs.tag }}" > "$MARKER_FILE"
          # Bump package.json patch version without creating a tag automatically
          npm version patch --no-git-tag-version
          NEW_VERSION=$(node -p "require('./package.json').version")
          echo "NEW_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          echo "Bumped package.json version to $NEW_VERSION"

      - name: Commit changes
        if: ${{ steps.latest.outputs.tag != steps.previous.outputs.prev }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json "$MARKER_FILE"
          git commit -m "Chore: Vale rules update for version ${{ steps.latest.outputs.tag }}"

      - name: Push commit to main
        if: ${{ steps.latest.outputs.tag != steps.previous.outputs.prev }}
        run: |
          git push origin HEAD:${TARGET_BRANCH}

      - name: Create and push tag to trigger image build
        if: ${{ steps.latest.outputs.tag != steps.previous.outputs.prev }}
        run: |
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          git push origin "$NEW_VERSION"
